[package]
name = "quest_scanner"
version = "0.3.6"
edition = "2021"
description = "Aurora Quests — a fast, modern native viewer/completer for Discord Quests"

[[bin]]
name = "discord_quests"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"
ico = "0.3"
png = "0.17"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
aes-gcm = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
wry = "0.56"
tao = "0.36"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tray-icon = "0.19"
tauri-winrt-notification = "0.7"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

# Optimize for a small, fast release binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
