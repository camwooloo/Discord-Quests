name: CI

# Build on both platforms for every push / PR. This is what proves the Linux
# port compiles (WebKitGTK + tray + token crypto) without needing a local Arch
# box — and it uploads a runnable Linux binary as an artifact on each run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Rename binary
        run: cp target/release/discord_quests discord_quests-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: discord_quests-linux-x86_64
          path: discord_quests-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: discord_quests-windows-x86_64
          path: target/release/discord_quests.exe
