name: Release

# Push a tag like v0.5.0 to build both platforms and stage a DRAFT GitHub
# Release with the two binaries attached. The release is left as a draft so you
# can add notes and publish it yourself — the in-app auto-updater only sees it
# once it's published (drafts are excluded from the "latest release" API).
#
# Asset names must stay stable — the updater looks for `.exe` on Windows and a
# name containing "linux" on Linux (see src/update.rs).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.0)"
        required: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cp target/release/discord_quests discord_quests-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: discord_quests-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/discord_quests.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Aurora Quests ${{ steps.tag.outputs.tag }}
          draft: true
          files: |
            dist/windows/discord_quests.exe
            dist/linux/discord_quests-linux-x86_64
